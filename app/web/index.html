<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="조호성 — Backend / Infra Engineer Portfolio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조호성 — Portfolio</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>

  <style>
    #back-affordance{
      position:fixed; top:16px; left:56px; z-index:2147483000;
      display:none; align-items:center; gap:10px;
      height:48px; min-width:104px; padding:0 20px; box-sizing:border-box;
      border:1.5px solid #222832; border-radius:999px;
      background:rgba(255,255,255,.92); backdrop-filter:blur(14px);
      font:600 16px/1 A2Z,system-ui,sans-serif; color:#222832;
      cursor:pointer; box-shadow:0 8px 24px rgba(34,40,50,.14);
      opacity:0; transform:translateY(-6px);
      transition:opacity .22s ease, transform .22s ease,
                 background .16s ease, color .16s ease;
    }
    #back-affordance.on{ display:inline-flex; }
    #back-affordance.show{ opacity:1; transform:translateY(0); }
    #back-affordance:hover{ background:#222832; color:#E4E7EA; }
    #back-affordance:hover svg{ stroke:#E4E7EA; }
    #back-affordance:focus-visible{ outline:3px solid #8B5CF6; outline-offset:3px; }
    @media (max-width:720px){ #back-affordance{ left:20px; } }
    @media (prefers-color-scheme:dark){
      #back-affordance{ background:rgba(18,22,28,.92); border-color:#E9ECF1; color:#E9ECF1; }
      #back-affordance svg{ stroke:#E9ECF1; }
    }
  </style>
  <button id="back-affordance" type="button" aria-label="뒤로">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="#222832" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M11 18l-6-6 6-6"/>
    </svg>
    <span>뒤로</span>
  </button>
  <script>
    (function () {
      var el = document.getElementById('back-affordance');
      var y = 0;                 // estimated scroll offset
      var THRESHOLD = 90;        // original header is 80 tall

      function onProject() { return /#\/project\//.test(location.hash); }

      function render() {
        var active = onProject();
        el.classList.toggle('on', active);
        el.classList.toggle('show', active && y > THRESHOLD);
      }
      function bump(d) { y = Math.max(0, y + d); render(); }

      addEventListener('wheel', function (e) { bump(e.deltaY); }, { passive: true });

      var ty = null;
      addEventListener('touchstart', function (e) {
        ty = e.touches[0].clientY;
      }, { passive: true });
      addEventListener('touchmove', function (e) {
        if (ty !== null) { bump(ty - e.touches[0].clientY); ty = e.touches[0].clientY; }
      }, { passive: true });

      addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && onProject()) { el.click(); return; }
        if (e.key === 'PageDown' || e.key === ' ') bump(600);
        else if (e.key === 'PageUp') bump(-600);
        else if (e.key === 'ArrowDown') bump(60);
        else if (e.key === 'ArrowUp') bump(-60);
        else if (e.key === 'End') bump(100000);
        else if (e.key === 'Home') { y = 0; render(); }
      });

      el.addEventListener('click', function () {
        if (history.length > 1) history.back();
        else location.hash = '#/portfolio';
      });

      addEventListener('hashchange', function () { y = 0; render(); });
      render();
    })();
  </script>

  <style>
    #lang-gate{
      position:fixed; inset:0; z-index:2147483001;
      display:flex; align-items:center; justify-content:center; padding:16px;
      background:#E4E7EA; color:#222832;
      font:600 16px/1.4 A2Z,system-ui,sans-serif;
    }
    #lang-gate[hidden], #lang-toggle[hidden]{ display:none; }
    #lang-gate p{ margin:0 0 24px; text-align:center; font-size:18px; }
    #lang-gate .row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    #lang-gate button, #lang-toggle{
      height:48px; padding:0 24px; box-sizing:border-box;
      border:1.5px solid #222832; border-radius:999px;
      background:rgba(255,255,255,.92); color:#222832;
      font:600 16px/1 A2Z,system-ui,sans-serif; cursor:pointer;
      transition:background .16s ease, color .16s ease;
    }
    #lang-gate button{ min-width:140px; }
    #lang-toggle{
      position:fixed; right:16px; bottom:16px; z-index:2147483000;
      height:40px; padding:0 16px; font-size:14px;
      backdrop-filter:blur(14px); box-shadow:0 8px 24px rgba(34,40,50,.14);
    }
    #lang-gate button:hover, #lang-toggle:hover{ background:#222832; color:#E4E7EA; }
    #lang-gate button:focus-visible, #lang-toggle:focus-visible{ outline:3px solid #8B5CF6; outline-offset:3px; }
    @media (prefers-color-scheme:dark){
      #lang-gate{ background:#12161C; color:#E9ECF1; }
      #lang-gate button, #lang-toggle{ background:rgba(18,22,28,.92); border-color:#E9ECF1; color:#E9ECF1; }
      #lang-gate button:hover, #lang-toggle:hover{ background:#E9ECF1; color:#12161C; }
    }
  </style>
  <div id="lang-gate" role="dialog" aria-modal="true" aria-labelledby="lang-gate-title" hidden>
    <div>
      <p id="lang-gate-title">언어를 선택하세요<br>Choose a language</p>
      <div class="row">
        <button type="button" data-lang="ko" lang="ko">한국어</button>
        <button type="button" data-lang="en" lang="en">English</button>
      </div>
    </div>
  </div>
  <button id="lang-toggle" type="button" hidden></button>
  <script>
    // Picks main.dart.js (ko) or main.dart.en.js (en) before Flutter boots.
    // ?lang=en|ko in the URL wins, so an English link can be shared directly.
    // English strings live in i18n/en.json; rebuild with: node i18n/build-en.js
    (function () {
      function load() { try { return localStorage.getItem('lang'); } catch (e) { return null; } }
      function save(l) { try { localStorage.setItem('lang', l); } catch (e) {} }
      function valid(l) { return l === 'ko' || l === 'en'; }

      var param = new URLSearchParams(location.search).get('lang');
      if (valid(param)) save(param);
      var lang = valid(param) ? param : load();

      function start(l) {
        window.PORTFOLIO_LANG = l;
        document.getElementById('lang-gate').remove();
        if (l === 'en') {
          var back = document.getElementById('back-affordance');
          back.setAttribute('aria-label', 'Back');
          back.querySelector('span').textContent = 'Back';
        }

        var t = document.getElementById('lang-toggle');
        t.textContent = l === 'en' ? '한국어' : 'English';
        t.lang = l === 'en' ? 'ko' : 'en';
        t.hidden = false;
        t.onclick = function () {
          save(l === 'en' ? 'ko' : 'en');
          if (!param) return location.reload();
          var u = new URL(location.href);
          u.searchParams.delete('lang');
          location.replace(u); // drop ?lang= so it can't override the new choice
        };

        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }

      if (valid(lang)) return start(lang);

      var gate = document.getElementById('lang-gate');
      gate.hidden = false;
      gate.querySelectorAll('button').forEach(function (b) {
        b.onclick = function () {
          save(b.dataset.lang);
          start(b.dataset.lang);
        };
      });
      gate.querySelector('[data-lang="' + (/^ko/i.test(navigator.language) ? 'ko' : 'en') + '"]').focus();
    })();
  </script>
</body>
</html>
